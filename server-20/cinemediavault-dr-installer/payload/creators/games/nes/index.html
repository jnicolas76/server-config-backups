<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NES Game Library</title>
  <style>
    :root { color-scheme: dark; --panel: #121513; --line: #404640; --text: #f4f3eb; --muted: #a4aaa4; --accent: #e25b52; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070807; color: var(--text); }
    body { display: grid; grid-template-rows: 58px minmax(0, 1fr); font-family: Consolas, "Courier New", monospace; }
    header { display: grid; grid-template-columns: auto minmax(150px, .8fr) minmax(260px, 1.5fr) auto; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; font-size: 14px; white-space: nowrap; }
    input, select, button { height: 36px; border: 1px solid #4b524c; border-radius: 4px; background: #090b0a; color: var(--text); font: inherit; font-size: 12px; }
    input, select { width: 100%; min-width: 0; padding: 0 10px; }
    button { min-width: 58px; padding: 0 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .actions { display: flex; gap: 6px; }
    #volume-panel { position: absolute; z-index: 12; top: 50px; right: 12px; display: none; align-items: center; gap: 8px; width: 230px; padding: 8px; background: #121513; border: 1px solid var(--line); box-shadow: 0 6px 20px #000; }
    #volume-panel.open { display: flex; }
    #volume { flex: 1; padding: 0; accent-color: var(--accent); }
    dialog { width: min(520px, calc(100% - 24px)); max-height: min(620px, calc(100% - 24px)); padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #121513; color: var(--text); box-shadow: 0 18px 60px #000; }
    dialog::backdrop { background: rgba(0, 0, 0, .78); }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .dialog-header h2 { margin: 0; font-size: 16px; }
    .dialog-close { min-width: 36px; width: 36px; padding: 0; font-size: 18px; }
    .new-save { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .new-save input { flex: 1; }
    #state-list { max-height: 420px; overflow: auto; padding: 6px 14px 14px; }
    .state-slot { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; min-height: 58px; border-bottom: 1px solid #303530; }
    .state-slot strong, .state-slot small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .state-slot small { margin-top: 3px; color: var(--muted); }
    .state-slot .delete-state { min-width: 36px; width: 36px; padding: 0; }
    .empty-states { padding: 28px 0; color: var(--muted); text-align: center; }
    .netplay-content { display: grid; gap: 12px; padding: 16px; }
    .netplay-content p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .room-code { padding: 15px; border: 1px solid var(--line); background: #090b0a; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 4px; }
    .join-room { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    #netplay-status { min-height: 18px; color: var(--muted); font-size: 12px; }
    #netplay[aria-pressed="true"] { border-color: var(--accent); background: #2c1715; }
    #stage { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; background: #050505; }
    #nes { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #nes canvas { display: block; max-width: 100%; max-height: 100%; }
    body.controller-visible #nes canvas { max-height: calc(100% - 166px); }
    #status { position: absolute; left: 14px; bottom: 12px; padding: 5px 8px; background: rgba(0, 0, 0, .72); color: var(--muted); font-size: 11px; pointer-events: none; }
    #status.error { color: #ff8178; }
    #touch-controller { position: absolute; z-index: 4; left: 12px; right: 12px; bottom: 10px; height: 146px; display: none; align-items: center; justify-content: space-between; pointer-events: none; user-select: none; -webkit-user-select: none; }
    body.controller-visible #touch-controller { display: flex; }
    .controller-cluster { pointer-events: auto; }
    .dpad { width: 138px; height: 138px; display: grid; grid-template: repeat(3, 46px) / repeat(3, 46px); }
    .pad-button, .action-button, .system-button { touch-action: none; -webkit-tap-highlight-color: transparent; border: 2px solid #060706; background: #242824; color: #f4f3eb; box-shadow: inset 0 0 0 1px #5c625d, 0 2px 0 #000; font-weight: 700; }
    .pad-button { min-width: 0; width: 46px; height: 46px; padding: 0; border-radius: 3px; font-size: 22px; }
    .pad-up { grid-area: 1 / 2; }
    .pad-left { grid-area: 2 / 1; }
    .pad-center { grid-area: 2 / 2; background: #171a17; border: 2px solid #060706; }
    .pad-right { grid-area: 2 / 3; }
    .pad-down { grid-area: 3 / 2; }
    .system-buttons { display: flex; gap: 12px; align-self: flex-end; padding-bottom: 18px; pointer-events: auto; }
    .system-button { min-width: 70px; height: 32px; padding: 0 8px; border-radius: 3px; font-size: 10px; }
    .action-buttons { width: 154px; display: flex; align-items: center; justify-content: space-between; transform: rotate(-12deg); }
    .action-button { min-width: 0; width: 68px; height: 68px; padding: 0; border-radius: 50%; background: #bd302b; border-color: #5c100e; box-shadow: inset 0 0 0 2px #e36a63, 0 3px 0 #340706; font-size: 22px; }
    .pad-button.pressed, .action-button.pressed, .system-button.pressed { transform: translateY(2px); box-shadow: inset 0 0 0 2px #f4f3eb; filter: brightness(1.28); }
    .action-button.pressed { transform: translateY(2px); }
    #controller-toggle[aria-pressed="true"] { border-color: var(--accent); background: #2c1715; }
    body.auth-locked > :not(#password-gate) { visibility: hidden; }
    #password-gate { position: fixed; z-index: 9999; inset: 0; display: grid; place-items: center; padding: 18px; background: #070807; color: var(--text); font-family: Consolas, "Courier New", monospace; }
    body:not(.auth-locked) #password-gate { display: none; }
    .password-box { width: min(390px, 100%); display: grid; gap: 10px; padding: 18px; border: 1px solid var(--line); background: #121513; box-shadow: 0 16px 48px #000; }
    .password-box strong { font-size: 16px; }
    .password-box small { color: var(--muted); line-height: 1.4; }
    .password-box input, .password-box button { width: 100%; height: 38px; }
    .password-error { min-height: 18px; color: #ff8178; font-size: 12px; }
    @media (max-width: 850px) {
      body { grid-template-rows: 104px minmax(0, 1fr); }
      header { grid-template-columns: minmax(120px, .7fr) minmax(180px, 1.3fr); grid-template-rows: 38px 38px; }
      .brand { display: none; }
      .actions { grid-column: 1 / -1; justify-content: flex-end; }
      #volume-panel { top: 96px; }
    }
    @media (max-width: 620px) {
      body { grid-template-rows: 144px minmax(0, 1fr); }
      header { grid-template-columns: 1fr; grid-template-rows: 38px 38px 38px; gap: 4px; padding: 6px 8px; }
      .actions { grid-column: 1; justify-content: center; }
      .actions button { min-width: 48px; padding: 0 7px; }
      #touch-controller { left: 8px; right: 8px; }
      .dpad { width: 120px; height: 120px; grid-template: repeat(3, 40px) / repeat(3, 40px); }
      .pad-button { width: 40px; height: 40px; }
      .action-buttons { width: 132px; }
      .action-button { width: 58px; height: 58px; }
      .system-buttons { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); gap: 6px; padding: 0; }
      .system-button { min-width: 58px; height: 28px; font-size: 9px; }
      #volume-panel { top: 136px; right: 8px; }
    }
  </style>
  <script src="runtime/jsnes.min.js"></script>
</head>
<body class="auth-locked">
  <div id="password-gate" role="dialog" aria-modal="true" aria-labelledby="password-title">
    <form class="password-box" id="password-form">
      <strong id="password-title">NES Game Library</strong>
      <small>Enter password to continue.</small>
      <input id="password-input" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button type="submit">UNLOCK</button>
      <div class="password-error" id="password-error" aria-live="polite"></div>
    </form>
  </div>
  <header>
    <div class="brand">NES GAME LIBRARY</div>
    <input id="search" type="search" placeholder="SEARCH GAMES" aria-label="Search games">
    <select id="game" aria-label="Choose a game"></select>
    <div class="actions">
      <button id="save" type="button" title="Save state">SAVE</button>
      <button id="load" type="button" title="Load state">LOAD</button>
      <button id="audio-toggle" type="button" title="Volume and sound">VOL</button>
      <button id="reset" type="button" title="Reset game">RESET</button>
      <button id="netplay" type="button" title="Play with a second device over LAN" aria-pressed="false">NET</button>
      <button id="controller-toggle" type="button" title="Show or hide touch controller" aria-pressed="false">CTRL</button>
      <button id="fullscreen" type="button" title="Fullscreen">FULL</button>
    </div>
  </header>
  <div id="volume-panel" aria-label="Volume controls">
    <button id="mute" type="button" title="Mute or unmute">MUTE</button>
    <input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="Volume">
  </div>
  <main id="stage">
    <div id="nes" aria-label="NES emulator"></div>
    <div id="touch-controller" aria-label="Player 1 touch controller">
      <div class="dpad controller-cluster" aria-label="Directional pad">
        <button class="pad-button pad-up" type="button" data-nes-button="BUTTON_UP" aria-label="Up">&#9650;</button>
        <button class="pad-button pad-left" type="button" data-nes-button="BUTTON_LEFT" aria-label="Left">&#9664;</button>
        <div class="pad-center" aria-hidden="true"></div>
        <button class="pad-button pad-right" type="button" data-nes-button="BUTTON_RIGHT" aria-label="Right">&#9654;</button>
        <button class="pad-button pad-down" type="button" data-nes-button="BUTTON_DOWN" aria-label="Down">&#9660;</button>
      </div>
      <div class="system-buttons">
        <button class="system-button" type="button" data-nes-button="BUTTON_SELECT">SELECT</button>
        <button class="system-button" type="button" data-nes-button="BUTTON_START">START</button>
      </div>
      <div class="action-buttons controller-cluster" aria-label="Action buttons">
        <button class="action-button" type="button" data-nes-button="BUTTON_B">B</button>
        <button class="action-button" type="button" data-nes-button="BUTTON_A">A</button>
      </div>
    </div>
    <div id="status">READING LIBRARY</div>
  </main>
  <dialog id="save-dialog">
    <div class="dialog-header">
      <h2 id="save-dialog-title">SAVE STATE</h2>
      <button class="dialog-close" id="close-save-dialog" type="button" title="Close">X</button>
    </div>
    <div class="new-save" id="new-save">
      <input id="save-name" maxlength="40" placeholder="SAVE NAME" aria-label="Save name">
      <button id="create-save" type="button">SAVE NEW</button>
    </div>
    <div id="state-list"></div>
  </dialog>
  <dialog id="netplay-dialog">
    <div class="dialog-header">
      <h2>LAN MULTIPLAYER</h2>
      <button class="dialog-close" id="close-netplay-dialog" type="button" title="Close">X</button>
    </div>
    <div class="netplay-content">
      <p>Host the selected game as Player 1, or enter a room code on the second device to join as Player 2.</p>
      <button id="host-room" type="button">HOST THIS GAME</button>
      <div class="room-code" id="room-code" hidden></div>
      <div class="join-room">
        <input id="join-code" maxlength="8" autocomplete="off" placeholder="ROOM CODE" aria-label="Room code">
        <button id="join-room" type="button">JOIN AS P2</button>
      </div>
      <div id="netplay-status"></div>
    </div>
  </dialog>
  <script>
    const PAGE_PASSWORD = "Spectrum1"; // Change this password whenever you want.
    const AUTH_SESSION_KEY = `nes-auth:${location.pathname}`;

    function requirePagePassword() {
      return new Promise(resolve => {
        const gate = document.getElementById("password-gate");
        const form = document.getElementById("password-form");
        const input = document.getElementById("password-input");
        const error = document.getElementById("password-error");
        const stored = (() => { try { return sessionStorage.getItem(AUTH_SESSION_KEY); } catch (_) { return ""; } })();
        const unlock = () => {
          try { sessionStorage.setItem(AUTH_SESSION_KEY, PAGE_PASSWORD); } catch (_) {}
          document.body.classList.remove("auth-locked");
          gate.remove();
          resolve();
        };
        if (!PAGE_PASSWORD || stored === PAGE_PASSWORD) {
          unlock();
          return;
        }
        form.addEventListener("submit", event => {
          event.preventDefault();
          if (input.value === PAGE_PASSWORD) unlock();
          else {
            error.textContent = "Invalid password.";
            input.select();
          }
        });
        setTimeout(() => input.focus(), 0);
      });
    }

    const gameSelect = document.getElementById("game");
    const search = document.getElementById("search");
    const status = document.getElementById("status");
    const stage = document.getElementById("stage");
    const volumePanel = document.getElementById("volume-panel");
    const volumeSlider = document.getElementById("volume");
    const muteButton = document.getElementById("mute");
    const saveDialog = document.getElementById("save-dialog");
    const stateList = document.getElementById("state-list");
    const netplayButton = document.getElementById("netplay");
    const netplayDialog = document.getElementById("netplay-dialog");
    const netplayStatus = document.getElementById("netplay-status");
    const queryParams = new URLSearchParams(location.search);
    const netplay = {
      room: (queryParams.get("room") || "").toUpperCase(),
      role: queryParams.get("role") || "",
      socket: null,
      connected: false,
      peer: false,
      synced: false,
      stateTimer: null,
    };
    let catalog = [];
    let currentGame = null;
    let emulator = null;
    let autoSaveTimer = null;
    const controllerToggle = document.getElementById("controller-toggle");
    const touchController = document.getElementById("touch-controller");
    const activePointers = new Map();
    const localPressedButtons = new Set();
    const pressedByPlayer = {1: new Set(), 2: new Set()};
    let previousVolume = Number(localStorage.getItem("nes-volume") || 75);
    volumeSlider.value = String(previousVolume);

    function configureAudio() {
      const speakers = emulator?._speakers;
      if (!speakers?.audioCtx || !speakers?.node) return false;
      if (!speakers.masterGain) {
        speakers.node.disconnect();
        speakers.masterGain = speakers.audioCtx.createGain();
        speakers.node.connect(speakers.masterGain);
        speakers.masterGain.connect(speakers.audioCtx.destination);
      }
      speakers.masterGain.gain.value = Number(volumeSlider.value) / 100;
      return true;
    }

    async function unlockAudio() {
      const context = emulator?._speakers?.audioCtx;
      if (!context) return;
      if (context.state === "suspended") await context.resume();
      configureAudio();
      document.getElementById("audio-toggle").textContent = context.state === "running" ? "VOL" : "AUDIO";
    }

    function setVolume(value) {
      const level = Math.max(0, Math.min(100, Number(value)));
      volumeSlider.value = String(level);
      localStorage.setItem("nes-volume", String(level));
      if (level > 0) previousVolume = level;
      configureAudio();
      muteButton.textContent = level === 0 ? "UNMUTE" : "MUTE";
    }

    function setControllerVisible(visible, remember = true) {
      document.body.classList.toggle("controller-visible", visible);
      controllerToggle.setAttribute("aria-pressed", String(visible));
      controllerToggle.textContent = visible ? "HIDE" : "CTRL";
      if (remember) localStorage.setItem("nes-touch-controller", visible ? "show" : "hide");
      requestAnimationFrame(() => emulator?.fitInParent());
    }

    function localPlayer() {
      return netplay.role === "guest" ? 2 : 1;
    }

    function sendNetplay(message) {
      if (netplay.socket?.readyState === WebSocket.OPEN) {
        netplay.socket.send(JSON.stringify(message));
      }
    }

    function applyInput(player, button, pressed) {
      if (!emulator || !Number.isInteger(button)) return;
      const buttons = pressedByPlayer[player];
      if (pressed) {
        buttons.add(button);
        emulator.nes.buttonDown(player, button);
      } else {
        buttons.delete(button);
        emulator.nes.buttonUp(player, button);
      }
    }

    function setLocalButton(button, pressed) {
      if (!Number.isInteger(button)) return;
      if (pressed === localPressedButtons.has(button)) return;
      if (pressed) localPressedButtons.add(button);
      else localPressedButtons.delete(button);
      applyInput(localPlayer(), button, pressed);
      sendNetplay({type: "input", player: localPlayer(), button, pressed});
    }

    function releaseControllerPointer(pointerId) {
      const control = activePointers.get(pointerId);
      if (!control) return;
      const button = jsnes.Controller[control.dataset.nesButton];
      setLocalButton(button, false);
      activePointers.delete(pointerId);
      if (![...activePointers.values()].includes(control)) control.classList.remove("pressed");
    }

    function releaseAllControllerInput() {
      activePointers.clear();
      touchController.querySelectorAll(".pressed").forEach(control => control.classList.remove("pressed"));
      [...localPressedButtons].forEach(button => setLocalButton(button, false));
    }

    function neutralizeAllControllerInput() {
      releaseAllControllerInput();
      if (!emulator) return;
      const buttons = new Set(Object.values(jsnes.Controller).filter(Number.isInteger));
      for (const player of [1, 2]) buttons.forEach(button => applyInput(player, button, false));
    }

    touchController.querySelectorAll("[data-nes-button]").forEach(control => {
      control.addEventListener("contextmenu", event => event.preventDefault());
      control.addEventListener("pointerdown", event => {
        event.preventDefault();
        if (!emulator || activePointers.has(event.pointerId)) return;
        control.setPointerCapture(event.pointerId);
        activePointers.set(event.pointerId, control);
        control.classList.add("pressed");
        unlockAudio().catch(console.error);
        setLocalButton(jsnes.Controller[control.dataset.nesButton], true);
      });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
        control.addEventListener(type, event => releaseControllerPointer(event.pointerId));
      });
    });

    addEventListener("pointerup", event => releaseControllerPointer(event.pointerId), true);
    addEventListener("pointercancel", event => releaseControllerPointer(event.pointerId), true);
    addEventListener("blur", releaseAllControllerInput);
    addEventListener("pagehide", releaseAllControllerInput);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) releaseAllControllerInput();
    });

    const keyboardMap = {
      ArrowUp: "BUTTON_UP", ArrowDown: "BUTTON_DOWN", ArrowLeft: "BUTTON_LEFT", ArrowRight: "BUTTON_RIGHT",
      KeyX: "BUTTON_A", KeyZ: "BUTTON_B", KeyY: "BUTTON_B", Enter: "BUTTON_START",
      ControlRight: "BUTTON_SELECT", KeyS: "BUTTON_TURBO_A", KeyA: "BUTTON_TURBO_B",
    };
    document.addEventListener("keydown", event => {
      const buttonName = keyboardMap[event.code];
      if (!buttonName || event.repeat || /INPUT|SELECT/.test(event.target.tagName)) return;
      event.preventDefault();
      unlockAudio().catch(console.error);
      setLocalButton(jsnes.Controller[buttonName], true);
    });
    document.addEventListener("keyup", event => {
      const buttonName = keyboardMap[event.code];
      if (!buttonName) return;
      event.preventDefault();
      setLocalButton(jsnes.Controller[buttonName], false);
    });

    const savedControllerChoice = localStorage.getItem("nes-touch-controller");
    setControllerVisible(savedControllerChoice ? savedControllerChoice === "show" : matchMedia("(pointer: coarse)").matches, false);

    function setStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle("error", error);
    }

    function netplayUrl(role, room, gameId = currentGame?.id || selectedId()) {
      const params = new URLSearchParams({game: gameId, room, role});
      return `${location.pathname}?${params}`;
    }

    function randomRoomCode() {
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const values = new Uint8Array(6);
      crypto.getRandomValues(values);
      return [...values].map(value => alphabet[value % alphabet.length]).join("");
    }

    function setNetplayControls() {
      const guest = netplay.role === "guest";
      ["save", "load", "reset"].forEach(id => document.getElementById(id).disabled = guest);
      netplayButton.setAttribute("aria-pressed", String(Boolean(netplay.room)));
      netplayButton.textContent = netplay.room ? (guest ? "P2" : "P1") : "NET";
      document.getElementById("room-code").hidden = !netplay.room;
      document.getElementById("room-code").textContent = netplay.room;
    }

    function restoreEmulatorState(state) {
      emulator.nes.fromJSON(state);
      if (emulator.nes.rom.mapperType === 9) {
        // MMC2 save states restore latch values but jsnes does not reapply the matching CHR banks.
        emulator.nes.mmap._updateChr0();
        emulator.nes.mmap._updateChr1();
        emulator.nes.ppu.validTileData = false;
      }
      neutralizeAllControllerInput();
    }

    function sendCurrentState(force = false) {
      if (!emulator || netplay.role !== "host" || !netplay.peer) return;
      const inputActive = pressedByPlayer[1].size || pressedByPlayer[2].size;
      if (!force && inputActive) return;
      sendNetplay({type: "state", state: emulator.nes.toJSON()});
    }

    function connectNetplay() {
      if (!netplay.room || !netplay.role || !currentGame) return;
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${location.host}/netplay`);
      netplay.socket = socket;
      setNetplayControls();
      if (netplay.role === "guest") {
        emulator._frameTimer.stop();
        setStatus(`ROOM ${netplay.room} - CONNECTING AS PLAYER 2`);
      } else {
        setStatus(`ROOM ${netplay.room} - WAITING FOR PLAYER 2`);
      }
      socket.addEventListener("open", () => {
        socket.send(JSON.stringify({type: "join", room: netplay.room, role: netplay.role, gameId: currentGame.id}));
      });
      socket.addEventListener("message", event => {
        const message = JSON.parse(event.data);
        if (message.type === "error") {
          if (message.code === "game_mismatch" && message.gameId) {
            location.href = netplayUrl("guest", netplay.room, message.gameId);
            return;
          }
          setStatus(message.message || "NETPLAY ERROR", true);
          netplayStatus.textContent = message.message || "Unable to join room";
          return;
        }
        if (message.type === "joined") {
          netplay.connected = true;
          netplay.peer = message.peer;
          if (netplay.role === "guest") sendNetplay({type: "request-state"});
          else setStatus(`ROOM ${netplay.room} - ${message.peer ? "PLAYER 2 CONNECTED" : "WAITING FOR PLAYER 2"}`);
          return;
        }
        if (message.type === "peer-joined") {
          netplay.peer = true;
          setStatus(`ROOM ${netplay.room} - PLAYER 2 CONNECTED`);
          setTimeout(() => sendCurrentState(true), 100);
          return;
        }
        if (message.type === "peer-left") {
          netplay.peer = false;
          setStatus(`ROOM ${netplay.room} - OTHER PLAYER LEFT`);
          return;
        }
        if (message.type === "request-state" && netplay.role === "host") {
          sendCurrentState(true);
          return;
        }
        if (message.type === "state" && netplay.role === "guest") {
          restoreEmulatorState(message.state);
          if (!netplay.synced) emulator._frameTimer.start();
          netplay.synced = true;
          setStatus(`ROOM ${netplay.room} - PLAYER 2`);
          return;
        }
        if (message.type === "input") applyInput(Number(message.player), Number(message.button), Boolean(message.pressed));
      });
      socket.addEventListener("close", () => {
        netplay.connected = false;
        netplay.peer = false;
        clearInterval(netplay.stateTimer);
        if (netplay.role === "guest" && !netplay.synced) setStatus("ROOM CONNECTION CLOSED", true);
      });
      socket.addEventListener("error", () => setStatus("LAN MULTIPLAYER CONNECTION FAILED", true));
      if (netplay.role === "host") netplay.stateTimer = setInterval(() => sendCurrentState(), 10000);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("nes-game-library", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("states");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function stateKey(slotId) {
      return `${currentGame.id}::${slotId}`;
    }

    async function writeState(silent = false, slotId = "autosave", label = "Autosave") {
      if (!emulator || !currentGame) return;
      const db = await openDatabase();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("states", "readwrite");
        tx.objectStore("states").put({
          state: emulator.nes.toJSON(), savedAt: Date.now(), label, slotId,
        }, stateKey(slotId));
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
      if (!silent) setStatus("STATE SAVED");
    }

    async function getState(key) {
      const db = await openDatabase();
      const saved = await new Promise((resolve, reject) => {
        const request = db.transaction("states", "readonly").objectStore("states").get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      db.close();
      return saved;
    }

    async function readState(silent = false, key = stateKey("autosave")) {
      if (!emulator || !currentGame) return false;
      let saved = await getState(key);
      if (!saved && key === stateKey("autosave")) saved = await getState(currentGame.id);
      if (!saved) {
        if (!silent) setStatus("NO SAVED STATE");
        return false;
      }
      restoreEmulatorState(saved.state);
      if (!silent) setStatus("STATE LOADED");
      setTimeout(() => sendCurrentState(true), 100);
      return true;
    }

    async function listStates() {
      if (!currentGame) return [];
      const db = await openDatabase();
      const items = await new Promise((resolve, reject) => {
        const found = [];
        const request = db.transaction("states", "readonly").objectStore("states").openCursor();
        request.onsuccess = () => {
          const cursor = request.result;
          if (!cursor) return resolve(found);
          const key = String(cursor.key);
          if (key === currentGame.id || key.startsWith(`${currentGame.id}::`)) {
            found.push({key, ...cursor.value});
          }
          cursor.continue();
        };
        request.onerror = () => reject(request.error);
      });
      db.close();
      return items.sort((a, b) => b.savedAt - a.savedAt);
    }

    async function deleteState(key) {
      const db = await openDatabase();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("states", "readwrite");
        tx.objectStore("states").delete(key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function openStateManager(mode) {
      const states = await listStates();
      const manualStates = states.filter(item => item.slotId !== "autosave");
      document.getElementById("save-dialog-title").textContent = mode === "save" ? "SAVE STATE" : "LOAD STATE";
      document.getElementById("new-save").hidden = mode !== "save";
      stateList.replaceChildren();
      const visibleStates = mode === "save" ? manualStates : states;
      if (!visibleStates.length) {
        const empty = document.createElement("div");
        empty.className = "empty-states";
        empty.textContent = mode === "save" ? "NO MANUAL SAVES YET" : "NO SAVED STATES";
        stateList.append(empty);
      }
      visibleStates.forEach(item => {
        const row = document.createElement("div");
        row.className = "state-slot";
        const details = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = item.label || (item.slotId === "autosave" ? "Autosave" : "Legacy save");
        const time = document.createElement("small");
        time.textContent = new Date(item.savedAt).toLocaleString();
        details.append(name, time);
        const action = document.createElement("button");
        action.type = "button";
        action.textContent = mode === "save" ? "OVERWRITE" : "LOAD";
        action.addEventListener("click", async () => {
          if (mode === "save") {
            await writeState(false, item.slotId, item.label);
          } else {
            await readState(false, item.key);
          }
          saveDialog.close();
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete-state";
        remove.title = "Delete save state";
        remove.textContent = "X";
        remove.addEventListener("click", async () => {
          if (!confirm(`Delete ${name.textContent}?`)) return;
          await deleteState(item.key);
          openStateManager(mode);
        });
        row.append(details, action, remove);
        stateList.append(row);
      });
      if (!saveDialog.open) saveDialog.showModal();
    }

    function selectedId() {
      return new URLSearchParams(location.search).get("game") || catalog[0]?.id;
    }

    function renderGames() {
      const query = search.value.trim().toLowerCase();
      const selected = selectedId();
      const games = catalog.filter(game => game.title.toLowerCase().includes(query));
      gameSelect.replaceChildren(...games.map(game => {
        const option = new Option(`${game.title} - ${game.region}`, game.id, false, game.id === selected);
        return option;
      }));
    }

    async function startGame(game) {
      currentGame = game;
      document.title = `${game.title} - NES Game Library`;
      setStatus(`LOADING ${game.title.toUpperCase()}`);
      try {
        const response = await fetch(game.rom, {cache: "force-cache"});
        if (!response.ok) throw new Error(`ROM error ${response.status}`);
        const rom = new Uint8Array(await response.arrayBuffer());
        emulator = new jsnes.Browser({
          container: document.getElementById("nes"),
          romData: rom,
          onError: reason => setStatus(reason.message || String(reason), true),
        });
        // Route every local controller through the LAN-aware input path.
        emulator.keyboard.keys = {};
        emulator.gamepad.onButtonDown = (_player, button) => setLocalButton(button, true);
        emulator.gamepad.onButtonUp = (_player, button) => setLocalButton(button, false);
        // Audio starvation must not advance emulation outside the 60.098 Hz frame clock.
        // The jsnes default generates two extra frames per underrun, causing runaway speed.
        emulator._speakers.onBufferUnderrun = () => {};
        setTimeout(() => { configureAudio(); }, 250);
        addEventListener("resize", () => emulator?.fitInParent());
        if (netplay.role !== "guest") await readState(true);
        if (netplay.room && ["host", "guest"].includes(netplay.role)) {
          connectNetplay();
        } else {
          setStatus(game.title.toUpperCase());
          setNetplayControls();
        }
        if (netplay.role !== "guest") {
          autoSaveTimer = setInterval(() => writeState(true).catch(console.error), 30000);
        }
      } catch (reason) {
        setStatus(reason.message || String(reason), true);
      }
    }

    gameSelect.addEventListener("change", () => {
      const save = netplay.role === "guest" ? Promise.resolve() : writeState(true).catch(console.error);
      save.finally(() => {
        location.search = new URLSearchParams({game: gameSelect.value}).toString();
      });
    });
    search.addEventListener("input", renderGames);
    document.getElementById("save").addEventListener("click", () => openStateManager("save").catch(reason => setStatus(reason.message, true)));
    document.getElementById("load").addEventListener("click", () => openStateManager("load").catch(reason => setStatus(reason.message, true)));
    document.getElementById("create-save").addEventListener("click", async () => {
      const input = document.getElementById("save-name");
      const label = input.value.trim() || `Save ${new Date().toLocaleString()}`;
      const slotId = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      await writeState(false, slotId, label);
      input.value = "";
      saveDialog.close();
    });
    document.getElementById("close-save-dialog").addEventListener("click", () => saveDialog.close());
    document.getElementById("audio-toggle").addEventListener("click", () => {
      volumePanel.classList.toggle("open");
      unlockAudio().catch(reason => setStatus(reason.message, true));
    });
    volumeSlider.addEventListener("input", () => setVolume(volumeSlider.value));
    muteButton.addEventListener("click", () => setVolume(Number(volumeSlider.value) === 0 ? previousVolume : 0));
    setVolume(previousVolume);
    document.getElementById("reset").addEventListener("click", () => {
      if (!emulator) return;
      neutralizeAllControllerInput();
      emulator.nes.reloadROM();
      setStatus("GAME RESET");
      setTimeout(() => sendCurrentState(true), 100);
    });
    netplayButton.addEventListener("click", () => {
      setNetplayControls();
      netplayStatus.textContent = netplay.room
        ? `${netplay.role === "guest" ? "PLAYER 2" : "PLAYER 1"} IN ROOM ${netplay.room}`
        : "";
      if (!netplayDialog.open) netplayDialog.showModal();
    });
    document.getElementById("close-netplay-dialog").addEventListener("click", () => netplayDialog.close());
    document.getElementById("host-room").addEventListener("click", () => {
      location.href = netplayUrl("host", randomRoomCode());
    });
    document.getElementById("join-room").addEventListener("click", () => {
      const room = document.getElementById("join-code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!room) {
        netplayStatus.textContent = "ENTER THE HOST'S ROOM CODE";
        return;
      }
      location.href = netplayUrl("guest", room);
    });
    controllerToggle.addEventListener("click", () => setControllerVisible(!document.body.classList.contains("controller-visible")));
    document.getElementById("fullscreen").addEventListener("click", () => stage.requestFullscreen());
    addEventListener("pagehide", () => {
      clearInterval(autoSaveTimer);
      clearInterval(netplay.stateTimer);
      if (netplay.role !== "guest") writeState(true).catch(() => {});
      netplay.socket?.close();
    });

    requirePagePassword().then(() => fetch("catalog.json", {cache: "no-store"})).then(response => {
      if (!response.ok) throw new Error(`Catalog error ${response.status}`);
      return response.json();
    }).then(data => {
      catalog = data;
      renderGames();
      const game = catalog.find(item => item.id === selectedId()) || catalog[0];
      if (!game) throw new Error("No NES ROMs found");
      return startGame(game);
    }).catch(reason => setStatus(reason.message || String(reason), true));
  </script>
</body>
</html>
