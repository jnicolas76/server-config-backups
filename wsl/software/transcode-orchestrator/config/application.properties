# CineMediaVault Transcode Orchestrator settings
# Edit paths for the server where this suite is installed.

# Base working directory for queues, logs, and local encode scratch space.
data.dir=/mnt/c/DATA

# Media roots.
# Current production expects these local mount points to be backed by CIFS:
#   //192.168.1.20/Movies   -> /mnt/nfs-share-movies
#   //192.168.1.20/TV_Shows -> /mnt/nfs-share-tvshows
# The old Raspberry Pi .121 shares are no longer the default source.
movies.root=/mnt/nfs-share-movies/Movies
movies.completed.dir=/mnt/nfs-share-movies/COMPLETED
tv.root=/mnt/nfs-share-tvshows/TV Shows
tv.completed.dir=/mnt/nfs-share-tvshows/COMPLETED

# Copa is optional. Leave enabled=false after tournament work is done.
copa.enabled=false
copa.dir=/mnt/nfs-share-tvshows/TV Shows/Copa Mundial de la FIFA 2026 (2026)/Season 2026
copa.work.dir=/mnt/c/DATA/HANDBRAKE-TV
copa.commercial.work.dir=/mnt/c/DATA/COMMERCIAL-WORK
copa.pipeline=/mnt/c/DATA/copa-commercial-transcode.py
copa.target.gb=1.5
copa.encoder=x264
copa.preset=slow

# Movie H.265 policy.
# The current production rule is 500 MB per hour of runtime.
movies.encoder=x265
movies.preset=slow
movies.container=mp4
movies.gb.per.hour=0.5
movies.fallback.target.gb=1.0
movies.audio.kbps=160
movies.min.gb=3.0
movies.2160.min.gb=4.0
movies.queue=/mnt/c/DATA/orchestrator-movies-h265-queue.csv
movies.avi.queue=/mnt/c/DATA/handbrake-movies-avi-h265-queue.csv
movies.work.dir=/mnt/c/DATA/HANDBRAKE-H265
movies.log=/mnt/c/DATA/combined-transcode-movies-h265.log
movies.library.csv=/mnt/c/DATA/movie-file-sizes.csv
movies.library.html=/mnt/c/DATA/movie-file-sizes.html
movies.html.generator=/mnt/c/DATA/movie_csv_to_html.py

# TV H.265 policy.
tv.encoder=x265
tv.preset=slow
tv.container=mp4
tv.target.gb=0.7
tv.audio.kbps=160
tv.queue=/mnt/c/DATA/orchestrator-tv-h265-queue.csv
tv.avi.queue=/mnt/c/DATA/handbrake-tvshows-avi-h265-queue.csv
tv.work.dir=/mnt/c/DATA/HANDBRAKE-TV-H265
tv.log=/mnt/c/DATA/combined-transcode-tv-h265.log
tv.library.csv=/mnt/c/DATA/tvshow-file-sizes.csv
tv.library.html=/mnt/c/DATA/tvshow-file-sizes.html
tv.html.generator=/mnt/c/DATA/handbrake-project/tvshow_csv_to_html.py

# Orchestrator runtime.
orchestrator.state.file=/mnt/c/DATA/combined-transcode-orchestrator.state
orchestrator.log=/mnt/c/DATA/combined-transcode-orchestrator.log
orchestrator.pid.file=/mnt/c/DATA/combined-transcode-orchestrator.pid
orchestrator.skip.copa=true
orchestrator.max.cycles=0
orchestrator.sleep.seconds=2

# Watchdog.
watchdog.log=/mnt/c/DATA/transcode-queue-watchdog.log
watchdog.lock=/mnt/c/DATA/transcode-queue-watchdog.lock
watchdog.max.movie.queue=500
watchdog.max.tv.queue=1000
watchdog.cron.minute=7
watchdog.webex.hourly=true

# WebEx notifier.
webex.enabled=true
webex.notifier=/home/jnicolas/bin/send_webex_notification
webex.status.seconds=3600
webex.to.email=jonathan.nicolas@gmail.com
