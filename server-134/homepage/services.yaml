- Media:
    - CineMediaVault:
        href: http://192.168.1.20:8093
        description: Local movie, TV, comics, books, games, and stream status
        icon: /icons/cinemediavault.svg
        widget:
          type: customapi
          url: http://192.168.1.20:8093/api/homepage/status
          refreshInterval: 10000
          mappings:
            - field: movies
              label: Movies
              format: number
            - field: tv_shows
              label: Shows
              format: number
            - field: books
              label: Books
              format: number
            - field: comics
              label: Comics
              format: number
            - field: active_streams
              label: Active Streams
              format: number
            - field: downloads
              label: Downloads
              format: number
            - field: nes_games
              label: NES
              format: number
            - field: sega_games
              label: SEGA
              format: number
            - field: dos_games
              label: DOS
              format: number
            - field: mame_games
              label: MAME
              format: number
